<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havva Ne'mati</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f9d9d9 0%, #fbe8e6 40%, #fdf3f1 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .photo-wrap {
    width: 100%;
    max-width: 380px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 20px;
    border: 3px solid #a8615f;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(168,97,95,0.25);
  }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    letter-spacing: 4px;
    font-size: 28px;
    color: #7a3b3b;
    margin-bottom: 10px;
  }
  .tagline {
    color: #8a5a58;
    font-size: 15px;
    margin-bottom: 22px;
  }
  .icon-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 26px;
  }
  .icon-row a {
    width: 46px; height: 46px;
    border: 1.5px solid #c98f8d;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #a8615f;
    text-decoration: none;
    font-size: 18px;
    background: rgba(255,255,255,0.4);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .btn-filled {
    background: #a8615f;
    color: #fff;
  }
  .btn-outline {
    background: #ffffffaa;
    color: #7a3b3b;
    border: 1px solid #e8c7c5;
  }
  .btn .emoji { font-size: 20px; }
  .btn .txt { display: flex; flex-direction: column; }
  .btn .title { font-weight: 700; font-size: 15px; }
  .btn .sub { font-size: 12.5px; opacity: 0.85; margin-top: 2px; }
  .footer {
    margin-top: 30px;
    font-size: 12.5px;
    color: #a8615f;
  }
  .footer .brand {
    font-family: Georgia, serif;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo-wrap">
      <img src="https://havva-nemati.netlify.app/havva_product.jpg" alt="Havva Ne'mati">
    </div>
    <h1>HAVVA NE'MATI</h1>
    <div class="tagline">Tabiiy ne'matlar — kundalik hayotingiz uchun</div>

    <div class="icon-row">
      <a href="https://t.me/Havvanemati" title="Telegram">&#9992;</a>
      <a href="tel:+998972721989" title="Qo'ng'iroq qilish">&#128222;</a>
    </div>

    <a class="btn btn-filled" href="https://t.me/Havvanemati">
      <span class="emoji">&#9992;&#65039;</span>
      <span class="txt"><span class="title">Telegram</span><span class="sub">@Havvanemati</span></span>
    </a>

    <a class="btn btn-filled" href="tel:+998972721989">
      <span class="emoji">&#128222;</span>
      <span class="txt"><span class="title">Qo'ng'iroq qilish</span><span class="sub">+998 97 272 19 89</span></span>
    </a>

    <a class="btn btn-filled" href="https://t.me/Havvanemati">
      <span class="emoji">&#129309;</span>
      <span class="txt"><span class="title">Dillerlar bilan bog'lanish</span></span>
    </a>

    <a class="btn btn-outline" href="https://youtube.com">
      <span class="emoji">&#9654;&#65039;</span>
      <span class="txt"><span class="title">YouTube</span><span class="sub">Kanalimizga obuna bo'ling</span></span>
    </a>

    <a class="btn btn-outline" href="https://t.me/Havvanemati">
      <span class="emoji">&#127760;</span>
      <span class="txt"><span class="title">Saytga kirish</span></span>
    </a>

    <div class="footer">
      <div class="brand">HAVVA NE'MATI</div>
      <div>&copy; 2026 Havva Ne'mati</div>
    </div>
  </div>
</body>
</html>
